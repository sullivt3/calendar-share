services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar_share
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar_share"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://calendar:calendar@db:5432/calendar_share?schema=public
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://calendar:calendar@db:5432/calendar_share?schema=public
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./src/app:/app/src/app
      - ./src/components:/app/src/components
      - ./src/lib:/app/src/lib
      - ./src/server:/app/src/server
      - ./src/shared:/app/src/shared
      - ./src/worker:/app/src/worker
      - ./public:/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 5
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://calendar:calendar@db:5432/calendar_share?schema=public
    command: npm run worker
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
